name: Bootstrap persistent APK signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-signing-key:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate new persistent PKCS12 keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p signing-bootstrap

          # Generate the password inside GitHub Actions so no local tooling is required.
          # The password is exported only into the runner environment and packaged
          # into the short-lived bootstrap artifact for the repository owner.
          KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYSTORE_PASSWORD"

          keytool -genkeypair             -v             -keystore signing-bootstrap/fieldtrace-signing.jks             -storetype PKCS12             -storepass "$KEYSTORE_PASSWORD"             -keypass "$KEYSTORE_PASSWORD"             -alias fieldtrace             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Field Trace, OU=Tentelcom, O=Tentelcom del Oeste, L=Alajuela, ST=Alajuela, C=CR"

          SHA256="$(keytool -list -v             -keystore signing-bootstrap/fieldtrace-signing.jks             -storepass "$KEYSTORE_PASSWORD"             -alias fieldtrace             | awk -F': ' '/SHA256:/ {print $2; exit}')"

          test -n "$SHA256"

          base64 -w 0 signing-bootstrap/fieldtrace-signing.jks > signing-bootstrap/FIELDTRACE_KEYSTORE_B64.txt

          cat > signing-bootstrap/FIELDTRACE_KEYSTORE_PASSWORD.txt <<EOF
          $KEYSTORE_PASSWORD
          EOF

          cat > signing-bootstrap/FIELDTRACE_KEY_ALIAS.txt <<EOF
          fieldtrace
          EOF

          cat > signing-bootstrap/FIELDTRACE_SHA256.txt <<EOF
          $SHA256
          EOF

          cat > signing-bootstrap/README.txt <<EOF
          FIELD TRACE - PERSISTENT APK SIGNING KEY BOOTSTRAP

          This artifact was generated by GitHub Actions.
          It contains the new persistent APK signing key material.

          IMPORTANT:
          - Do NOT commit these files to the repository.
          - Create these four GitHub repository secrets from the files:
              FIELDTRACE_KEYSTORE_B64       <- FIELDTRACE_KEYSTORE_B64.txt
              FIELDTRACE_KEYSTORE_PASSWORD  <- FIELDTRACE_KEYSTORE_PASSWORD.txt
              FIELDTRACE_KEY_ALIAS          <- FIELDTRACE_KEY_ALIAS.txt
              FIELDTRACE_KEY_PASSWORD       <- use the same value as FIELDTRACE_KEYSTORE_PASSWORD.txt
          - After the four secrets are saved, delete this workflow run/artifact.
          - Keep a secure offline backup of the keystore and its password.
          - The APK signing fingerprint is:
              $SHA256
          EOF

          # Remove the raw keystore from the artifact. The Base64 representation
          # is the value that GitHub Actions will consume as a repository secret.
          rm -f signing-bootstrap/fieldtrace-signing.jks

          echo "PERSISTENT SIGNING KEY GENERATED"
          echo "ALIAS: fieldtrace"
          echo "SHA256: $SHA256"
          echo "BOOTSTRAP ARTIFACT READY"

      - name: Upload one-time signing bootstrap package
        uses: actions/upload-artifact@v4
        with:
          name: FieldTrace-signing-bootstrap
          path: signing-bootstrap/
          if-no-files-found: error
          retention-days: 1
