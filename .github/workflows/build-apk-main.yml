name: Build FielTrace APK - native camera fix
# Video overlay build verification

# Trigger build for the latest main application update.
# Manual APK build requested after latest desktop layout update.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit source before APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          app=Path('src/App.tsx').read_text()
          cam=Path('src/services/cameraService.ts').read_text()
          storage=Path('src/services/storageService.ts').read_text()
          manifest=Path('android/app/src/main/AndroidManifest.xml').read_text()
          pkg=json.loads(Path('package.json').read_text())
          checks={
            'CameraPreview dependency':'@capgo/camera-preview' in pkg['dependencies'],
            'Geolocation dependency':'@capacitor/geolocation' in pkg['dependencies'],
            'native camera start':'CameraPreview.start' in app,
            'native capture':'CameraPreview.capture' in app,
            'native zoom':'CameraPreview.setZoom' in app,
            'native flash':'CameraPreview.setFlashMode' in app,
            'overlay':'cameraService.drawOverlay(rawImage, evidenceObject)' in app,
            'gallery save':'cameraService.saveToGallery(finalImage, fileName)' in app,
            'Field Trace album':'Field Trace' in cam and 'Media.savePhoto' in cam,
            'no photo persistence':'La fotografía NO se persiste en IndexedDB' in storage,
            'manifest FINE location':'ACCESS_FINE_LOCATION' in manifest,
            'manifest COARSE location':'ACCESS_COARSE_LOCATION' in manifest,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('SOURCE AUDIT FAILED: '+', '.join(failed))
          print('SOURCE AUDIT PASSED')
          PY
      - name: Build web app
        run: npm run build
      - name: Ensure Capacitor Android platform
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Restore committed Gradle signing configuration after sync
        run: |
          set -euo pipefail
          git checkout -- android/app/build.gradle
          grep -q 'signingConfigs.fieldTrace' android/app/build.gradle
          grep -q 'FIELDTRACE_KEYSTORE_PASSWORD' android/app/build.gradle
          grep -q 'FIELDTRACE_KEY_ALIAS' android/app/build.gradle
          grep -q 'keyPassword System.getenv("FIELDTRACE_KEYSTORE_PASSWORD")' android/app/build.gradle
          echo "GRADLE SIGNING CONFIG RESTORED AFTER CAPACITOR SYNC"

      - name: Install correct launcher images from public assets
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          res = Path('android/app/src/main/res')
          source = Path('public/pwa-512x512.png')

          if not source.is_file():
              raise SystemExit(f'Launcher source image not found: {source}')

          src = Image.open(source).convert('RGBA')
          if src.width != 512 or src.height != 512:
              raise SystemExit(f'Launcher source must be 512x512, got {src.size}')

          print(f'LAUNCHER SOURCE: {source} size={src.size}')

          # Android legacy/round launcher icons. These are the resources used
          # on devices that do not use adaptive icons.
          legacy_sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          for folder, size in legacy_sizes.items():
              d = res / folder
              d.mkdir(parents=True, exist_ok=True)
              icon = src.resize((size, size), Image.Resampling.LANCZOS)
              for name in ('ic_launcher.png', 'ic_launcher_round.png'):
                  icon.save(d / name, 'PNG', optimize=True)

          # Android adaptive foreground resources need a safe-zone margin.
          # The previous implementation filled the entire adaptive canvas,
          # causing Android's launcher mask to crop/zoom the Field Trace artwork.
          # Keep the verified public image, but scale it to 72% and center it
          # on a transparent canvas so the full logo remains visible.
          adaptive_sizes = {
              'mipmap-mdpi': 108,
              'mipmap-hdpi': 162,
              'mipmap-xhdpi': 216,
              'mipmap-xxhdpi': 324,
              'mipmap-xxxhdpi': 432,
          }
          ADAPTIVE_SCALE = 0.72

          for folder, size in adaptive_sizes.items():
              d = res / folder
              d.mkdir(parents=True, exist_ok=True)
              artwork_size = round(size * ADAPTIVE_SCALE)
              artwork = src.resize((artwork_size, artwork_size), Image.Resampling.LANCZOS)
              foreground = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              offset = (size - artwork_size) // 2
              foreground.alpha_composite(artwork, (offset, offset))
              foreground.save(d / 'ic_launcher_foreground.png', 'PNG', optimize=True)

          # Adaptive icon background remains a solid white layer. The actual
          # launcher artwork comes exclusively from the verified public image.
          bg = res / 'values' / 'ic_launcher_background.xml'
          bg.parent.mkdir(parents=True, exist_ok=True)
          xml = chr(10).join([
              '<?xml version="1.0" encoding="utf-8"?>',
              '<resources>',
              '    <color name="ic_launcher_background">#FFFFFF</color>',
              '</resources>',
              ''
          ])
          bg.write_bytes(xml.encode('utf-8'))

          # Dedicated native splash artwork.
          #
          # Android 12+ applies the splash icon mask to the drawable supplied to
          # windowSplashScreenAnimatedIcon. The launcher icon must remain separate.
          # To prevent the system mask from cutting the rounded FieldTrace logo,
          # place the complete public logo on an opaque white canvas and keep the
          # artwork inside the documented safe area. The white canvas is visually
          # identical to the white splash background, so no extra frame is visible.
          splash = res / 'drawable' / 'splash_icon.png'
          splash.parent.mkdir(parents=True, exist_ok=True)
          SPLASH_SCALE = 0.66
          artwork_size = round(512 * SPLASH_SCALE)
          artwork = src.resize((artwork_size, artwork_size), Image.Resampling.LANCZOS)
          splash_image = Image.new('RGBA', (512, 512), (255, 255, 255, 255))
          offset = (512 - artwork_size) // 2
          splash_image.alpha_composite(artwork, (offset, offset))
          splash_image.save(splash, 'PNG', optimize=True)
          print(
              f'CUSTOM SPLASH ARTWORK INSTALLED: complete public logo centered at '
              f'{SPLASH_SCALE:.0%} on opaque white canvas'
          )

          # Android's system splash icon is intentionally invisible. Android 12+
          # always masks this icon; the complete branding is rendered immediately
          # after the system splash by MainActivity as a full-screen white overlay.
          system_icon = res / 'drawable' / 'splash_system_icon.xml'
          system_icon.write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="1dp"
              android:height="1dp"
              android:viewportWidth="1"
              android:viewportHeight="1">
              <path
                  android:fillColor="#00000000"
                  android:pathData="M0,0" />
          </vector>
          ''',
              encoding='utf-8'
          )
          print('SYSTEM SPLASH ICON INSTALLED: invisible vector on white background')

          print('LAUNCHER ICONS INSTALLED FROM public/pwa-512x512.png')
          PY

      - name: Restore committed native files after sync (MainActivity + AndroidManifest)
        run: |
          set -euo pipefail
          test -f android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          git checkout -- android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'FieldTraceNative' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'getDefaultVideoPoster' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          echo "NATIVE MAINACTIVITY RESTORED"
          git checkout -- android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/values android/app/src/main/res/values-v31
          cat > android/app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#FFFFFF</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_system_icon</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          XML
          cat > android/app/src/main/res/values-v31/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#FFFFFF</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_system_icon</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          XML
          echo "=== AndroidManifest after restore ==="
          cat android/app/src/main/AndroidManifest.xml
          echo "=== Splash styles after restore ==="
          cat android/app/src/main/res/values/styles.xml
          cat android/app/src/main/res/values-v31/styles.xml
          grep -q ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_COARSE_LOCATION android/app/src/main/AndroidManifest.xml
          echo "NATIVE FILES AND SPLASH STYLES RESTORED AFTER CAPACITOR SYNC"
      - name: Restore audio permission after Capacitor sync
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST" || sed -i '/<uses-permission android:name="android.permission.CAMERA" \/>/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' "$MANIFEST"
          echo "AUDIO PERMISSIONS RESTORED AFTER CAPACITOR SYNC"

      - name: Restore persistent APK signing key
        run: |
          set -euo pipefail
          test -n "${{ secrets.FIELDTRACE_KEYSTORE_B64 }}" || { echo "FIELDTRACE_KEYSTORE_B64 is required"; exit 1; }
          echo "${{ secrets.FIELDTRACE_KEYSTORE_B64 }}" | base64 --decode > android/app/fieldtrace-signing.jks
          test -s android/app/fieldtrace-signing.jks
      - name: Verify and normalize persistent APK signing credentials
        env:
          RAW_FIELDTRACE_KEYSTORE_PASSWORD: ${{ secrets.FIELDTRACE_KEYSTORE_PASSWORD }}
          RAW_FIELDTRACE_KEY_ALIAS: ${{ secrets.FIELDTRACE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -s android/app/fieldtrace-signing.jks
          test -n "$RAW_FIELDTRACE_KEYSTORE_PASSWORD"
          test -n "$RAW_FIELDTRACE_KEY_ALIAS"

          # The bootstrap password is generated as hexadecimal text and the alias
          # is "fieldtrace". Strip only accidental whitespace introduced while
          # copying the one-line secret values into GitHub.
          FIELDTRACE_KEYSTORE_PASSWORD="$(printf '%s' "$RAW_FIELDTRACE_KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          FIELDTRACE_KEY_ALIAS="$(printf '%s' "$RAW_FIELDTRACE_KEY_ALIAS" | tr -d '[:space:]')"
          test -n "$FIELDTRACE_KEYSTORE_PASSWORD"
          test -n "$FIELDTRACE_KEY_ALIAS"

          echo "::add-mask::$FIELDTRACE_KEYSTORE_PASSWORD"
          printf 'FIELDTRACE_KEYSTORE_PASSWORD=%s\n' "$FIELDTRACE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'FIELDTRACE_KEY_ALIAS=%s\n' "$FIELDTRACE_KEY_ALIAS" >> "$GITHUB_ENV"

          if ! KEYTOOL_OUT=$(keytool -list -v \
            -storetype PKCS12 \
            -keystore android/app/fieldtrace-signing.jks \
            -storepass "$FIELDTRACE_KEYSTORE_PASSWORD" \
            -alias "$FIELDTRACE_KEY_ALIAS" \
            2>&1); then
            echo "ERROR: persistent signing key could not be opened with the configured GitHub secret."
            echo "Safe keytool diagnostic:"
            keytool -list \
              -storetype PKCS12 \
              -keystore android/app/fieldtrace-signing.jks \
              -storepass "$FIELDTRACE_KEYSTORE_PASSWORD" \
              2>&1 || true
            exit 1
          fi

          EXPECTED_SHA256=$(echo "$KEYTOOL_OUT" | awk -F': ' '/SHA256:/ {print $2; exit}')
          test -n "$EXPECTED_SHA256"
          echo "$KEYTOOL_OUT" | grep -q "Alias name: $FIELDTRACE_KEY_ALIAS"
          echo "$KEYTOOL_OUT" | grep -q "SHA256: $EXPECTED_SHA256"
          echo "PERSISTENT KEY VERIFIED BEFORE BUILD"
          echo "Certificate SHA-256: $EXPECTED_SHA256"

      - name: Set CI APK version code
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path('android/app/build.gradle')
          text = path.read_text()
          run_number = os.environ['GITHUB_RUN_NUMBER']
          import re
          match = re.search(r'versionCode\s+\d+', text)
          if not match:
              raise SystemExit('Could not locate versionCode in android/app/build.gradle')
          text = text[:match.start()] + f'versionCode {run_number}' + text[match.end():]
          path.write_text(text)
          print(f'CI APK versionCode set to {run_number}')
          PY
          grep -q "versionCode ${GITHUB_RUN_NUMBER}" android/app/build.gradle

      - name: VIDEO OVERLAY IMPLEMENTATION AUDIT
        run: |
          set -euo pipefail
          grep -q 'startRecordVideo' src/App.tsx
          grep -q 'stopRecordVideo' src/App.tsx
          grep -q 'getSupportedVideoQualities' src/App.tsx
          grep -q 'getSupportedVideoCodecs' src/App.tsx
          grep -q 'getSupportedVideoFrameRates' src/App.tsx
          grep -q 'getVideoFileInfo' src/App.tsx
          grep -q 'enableVideoMode: true' src/App.tsx
          grep -q 'composeVideoWithOverlay' src/App.tsx
          grep -q 'saveVideoToGallery' src/App.tsx
          grep -q 'composeVideoWithOverlay' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'saveVideoToGallery' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'getVideoFileInfo' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'resolveVideoFile' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'media3-transformer:1.11.1' android/app/build.gradle
          grep -q 'media3-effect:1.11.1' android/app/build.gradle
          grep -q 'media3-common:1.11.1' android/app/build.gradle
          grep -q 'video/mp4' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'READ_MEDIA_VIDEO' android/app/src/main/AndroidManifest.xml
          echo "VIDEO OVERLAY IMPLEMENTATION AUDIT PASSED"
      - name: Prepare Gradle
        working-directory: android
        run: chmod +x gradlew
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK to FieldTrace.apk
        run: |
          set -euo pipefail
          OUT="android/app/build/outputs/apk/debug"
          ls -la "$OUT" || true
          # Prefer already-named file; otherwise take the newest *.apk and rename
          if [ -f "$OUT/FieldTrace.apk" ]; then
            echo "Already FieldTrace.apk"
          else
            SRC=$(ls -1t "$OUT"/*.apk 2>/dev/null | head -1 || true)
            if [ -z "$SRC" ]; then
              echo "No APK found in $OUT"
              find android/app/build/outputs -name '*.apk' -print || true
              exit 1
            fi
            echo "Renaming $SRC -> $OUT/FieldTrace.apk"
            mv "$SRC" "$OUT/FieldTrace.apk"
          fi
          test -s "$OUT/FieldTrace.apk"
          ls -lh "$OUT/FieldTrace.apk"
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/FieldTrace.apk"
          test -s "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"

          VERIFY_OUT=$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)
          echo "$VERIFY_OUT"

          KEY_SHA256=$(keytool -list -v \
            -storetype PKCS12 \
            -keystore android/app/fieldtrace-signing.jks \
            -storepass "$FIELDTRACE_KEYSTORE_PASSWORD" \
            -alias "$FIELDTRACE_KEY_ALIAS" \
            | awk -F': ' '/SHA256:/ {print $2; exit}' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')
          # apksigner prefixes the digest line with "V2 Signer:".
          # Using $2 would capture the label instead of the digest; use the
          # final colon-separated field so the comparison is against the actual
          # certificate fingerprint.
          APK_SHA256=$(echo "$VERIFY_OUT" \
            | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')

          test -n "$KEY_SHA256"
          test -n "$APK_SHA256"
          test "$APK_SHA256" = "$KEY_SHA256"

          if echo "$VERIFY_OUT" | grep -q "CN=Android Debug"; then
            echo "FAIL: APK is signed with Android Debug instead of the persistent FieldTrace key"
            exit 1
          fi

          echo "APK SIGNATURE VERIFIED: persistent FieldTrace certificate is active"
          echo "APK signature SHA-256 matches the configured persistent keystore"

      - name: Verify APK launcher icon matches public asset
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/FieldTrace.apk"
          TMP=$(mktemp -d)
          unzip -q -o "$APK" \
            'res/mipmap-mdpi-v4/ic_launcher.png' \
            'res/mipmap-hdpi-v4/ic_launcher.png' \
            'res/mipmap-xhdpi-v4/ic_launcher.png' \
            'res/mipmap-xxhdpi-v4/ic_launcher.png' \
            'res/mipmap-xxxhdpi-v4/ic_launcher.png' \
            'res/mipmap-xxxhdpi-v4/ic_launcher_foreground.png' \
            'res/mipmap-xxxhdpi-v4/ic_launcher_round.png' \
            -d "$TMP"

          python3 -m pip install --disable-pip-version-check Pillow
          python3 - <<'PY' "$TMP"
          from pathlib import Path
          from PIL import Image
          import sys

          root = Path(sys.argv[1])
          source_path = Path('public/pwa-512x512.png')
          source = Image.open(source_path).convert('RGBA')

          legacy = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192,
          }

          def compare(actual_path, expected_size, label):
              actual = Image.open(actual_path).convert('RGBA')
              expected = source.resize((expected_size, expected_size), Image.Resampling.LANCZOS)
              if actual.size != expected.size:
                  raise SystemExit(f'{label} size mismatch: actual={actual.size} expected={expected.size}')
              from PIL import ImageChops
              diff = ImageChops.difference(actual, expected)
              bbox = diff.getbbox()
              if bbox is not None:
                  raise SystemExit(f'{label} does not match public asset: diff_bbox={bbox}')
              print(f'{label} MATCHED EXACTLY')

          for density, size in legacy.items():
              compare(
                  root / f'res/mipmap-{density}-v4/ic_launcher.png',
                  size,
                  f'legacy ic_launcher {density}'
              )

          compare(
              root / 'res/mipmap-xxxhdpi-v4/ic_launcher_round.png',
              192,
              'legacy ic_launcher_round xxxhdpi'
          )

          # Adaptive foreground is intentionally reduced to 72% and centered
          # inside the 432px safe canvas to prevent launcher-mask cropping.
          actual_fg = Image.open(
              root / 'res/mipmap-xxxhdpi-v4/ic_launcher_foreground.png'
          ).convert('RGBA')
          expected_artwork_size = round(432 * 0.72)
          expected_artwork = source.resize(
              (expected_artwork_size, expected_artwork_size),
              Image.Resampling.LANCZOS
          )
          expected_fg = Image.new('RGBA', (432, 432), (0, 0, 0, 0))
          offset = (432 - expected_artwork_size) // 2
          expected_fg.alpha_composite(expected_artwork, (offset, offset))

          if actual_fg.size != expected_fg.size:
              raise SystemExit(
                  f'adaptive foreground size mismatch: actual={actual_fg.size} expected={expected_fg.size}'
              )
          from PIL import ImageChops
          diff = ImageChops.difference(actual_fg, expected_fg)
          bbox = diff.getbbox()
          if bbox is not None:
              raise SystemExit(
                  f'adaptive foreground does not match 72% safe-zone composition: diff_bbox={bbox}'
              )
          print('adaptive foreground xxxhdpi MATCHED 72% SAFE-ZONE COMPOSITION')

          print('LAUNCHER ICON AUDIT PASSED: legacy icons match public asset and adaptive foreground uses 72% safe zone')
          PY

      - name: Simulate and verify launch splash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/FieldTrace.apk"
          TMP=$(mktemp -d)
          unzip -q -o "$APK"             'res/drawable/splash_icon.png'             'res/drawable/splash_system_icon.xml'             'res/drawable-v23/compat_splash_screen.xml'             'res/drawable-v23/compat_splash_screen_no_icon_background.xml'             -d "$TMP"

          python3 - <<'PY' "$TMP"
          from pathlib import Path
          from PIL import Image, ImageChops
          import re
          import math

          root = Path(__import__('sys').argv[1])
          source = Image.open('public/pwa-512x512.png').convert('RGBA')
          actual = Image.open(root / 'res/drawable/splash_icon.png').convert('RGBA')

          if actual.size != (512, 512):
              raise SystemExit(f'CUSTOM SPLASH SIZE FAILED: {actual.size}')

          corners = [
              actual.getpixel((0, 0)),
              actual.getpixel((511, 0)),
              actual.getpixel((0, 511)),
              actual.getpixel((511, 511)),
          ]
          if any(px != (255, 255, 255, 255) for px in corners):
              raise SystemExit(f'CUSTOM SPLASH BACKGROUND FAILED: corners={corners}')

          scale = 0.66
          artwork_size = round(512 * scale)
          expected_artwork = source.resize(
              (artwork_size, artwork_size),
              Image.Resampling.LANCZOS
          )
          expected = Image.new('RGBA', (512, 512), (255, 255, 255, 255))
          offset = (512 - artwork_size) // 2
          expected.alpha_composite(expected_artwork, (offset, offset))

          diff = ImageChops.difference(actual, expected)
          if diff.getbbox() is not None:
              raise SystemExit('CUSTOM SPLASH ARTWORK FAILED: unexpected pixels')

          packaged_system_icon = root / 'res/drawable/splash_system_icon.xml'
          if not packaged_system_icon.is_file() or packaged_system_icon.stat().st_size == 0:
              raise SystemExit('SYSTEM SPLASH ICON FAILED: vector resource missing from APK')

          source_system_icon = Path('android/app/src/main/res/drawable/splash_system_icon.xml').read_text()
          if '#00000000' not in source_system_icon or 'pathData="M0,0"' not in source_system_icon:
              raise SystemExit('SYSTEM SPLASH ICON FAILED: source vector is not invisible')

          # Launch simulation:
          # 1) Android system splash = opaque white background + invisible icon.
          # 2) MainActivity = full-screen white overlay containing the complete
          #    FieldTrace artwork. This bypasses the Android icon mask that
          #    previously clipped the lower-right tentelcom mark.
          #
          # The simulation renders the expected phone viewport and verifies that
          # no artwork pixel is clipped by a system icon circle because the
          # system icon is intentionally invisible.
          viewport = Image.new('RGBA', (709, 1536), (255, 255, 255, 255))
          overlay = expected.resize((709, 709), Image.Resampling.LANCZOS)
          y = (1536 - 709) // 2
          viewport.alpha_composite(overlay, (0, y))
          sim_path = Path('launch-splash-simulation.png')
          viewport.save(sim_path, 'PNG', optimize=True)

          # Verify the simulated logo is entirely on-canvas and the corners of
          # the viewport remain white.
          if viewport.getpixel((0, 0)) != (255, 255, 255, 255):
              raise SystemExit('LAUNCH SIMULATION FAILED: top-left not white')
          if viewport.getpixel((708, 1535)) != (255, 255, 255, 255):
              raise SystemExit('LAUNCH SIMULATION FAILED: bottom-right not white')

          print('LAUNCH SIMULATION PASSED: white system splash -> complete centered FieldTrace logo -> fade to app')
          print(f'SIMULATION IMAGE: {sim_path}')
          PY

      - name: Verify SplashScreen implementation
        run: |
          set -euo pipefail
          MAIN="android/app/src/main/java/com/fieldtrace/app/MainActivity.java"
          test -f "$MAIN"
          grep -q 'androidx.core.splashscreen.SplashScreen' "$MAIN"
          grep -q 'SplashScreen.installSplashScreen(this);' "$MAIN"
          grep -q 'showFieldTraceLaunchSplash();' "$MAIN"

          # Capacitor sync may normalize Android resource files, so validate the
          # final merged source tree rather than relying on one exact XML file.
          grep -R -q 'Theme.SplashScreen' android/app/src/main/res
          grep -R -q 'postSplashScreenTheme' android/app/src/main/res
          grep -R -q 'splash_system_icon' android/app/src/main/res

          APK="android/app/build/outputs/apk/debug/FieldTrace.apk"
          unzip -l "$APK" | grep -q 'res/drawable/splash_icon.png'
          unzip -l "$APK" | grep -q 'res/drawable/splash_system_icon.xml'
          echo "SPLASH IMPLEMENTATION AUDIT PASSED"

      - name: Validate APK location permissions (aapt)
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/FieldTrace.apk"
          test -s "$APK"
          AAPT=$(ls "${ANDROID_HOME}/build-tools"/*/aapt 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ]; then
            AAPT=$(ls "${ANDROID_SDK_ROOT}/build-tools"/*/aapt 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using aapt: $AAPT"
          echo "=== aapt dump permissions ==="
          "$AAPT" dump permissions "$APK" || true
          echo "=== aapt dump badging (uses-permission lines) ==="
          "$AAPT" dump badging "$APK" | grep -i permission || true
          PERMS=$("$AAPT" dump permissions "$APK" 2>/dev/null || true)
          echo "$PERMS" | grep -q "ACCESS_FINE_LOCATION" || {
            echo "FAIL: ACCESS_FINE_LOCATION missing from final APK (aapt)"
            TMP=$(mktemp -d)
            unzip -q -o "$APK" AndroidManifest.xml -d "$TMP" || true
            echo "strings sample:"; strings "$TMP/AndroidManifest.xml" 2>/dev/null | grep -i LOCATION || true
            find android -name "AndroidManifest.xml" 2>/dev/null | head -20
            exit 1
          }
          echo "$PERMS" | grep -q "ACCESS_COARSE_LOCATION" || {
            echo "FAIL: ACCESS_COARSE_LOCATION missing from final APK (aapt)"
            exit 1
          }
          echo "PASS: location permissions present in final APK"
          ls -lh "$APK"
      - name: Final APK audit
        run: |
          test -s android/app/build/outputs/apk/debug/FieldTrace.apk
          echo "APK BUILD AND FINAL AUDIT PASSED"
      - name: FINAL CAMERA VIDEO AUDIT
        run: |
          set -euo pipefail
          grep -q 'grid grid-cols-7 items-center h-\[76px\]' src/App.tsx
          grep -q 'col-start-2 flex items-center justify-center' src/App.tsx
          grep -q 'col-start-4 flex items-center justify-center' src/App.tsx
          grep -q 'col-start-7 flex items-center justify-center' src/App.tsx
          grep -q 'disableAudio: false' src/App.tsx
          ! grep -q 'storeToFile: false, disableAudio: true' src/App.tsx
          grep -q 'requestPermissions' src/App.tsx
          grep -q 'setRemoveAudio(false)' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'setAudioMimeType(MimeTypes.AUDIO_AAC)' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'audioTracks' android/app/src/main/java/com/fieldtrace/app/MainActivity.java
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' android/app/src/main/AndroidManifest.xml
          ! grep -q 'translate-x-\[56px\]\|translate-x-\[68px\]\|translate-x-\[78px\]' src/App.tsx
          echo "CAMERA_VIDEO_AUDIT=PASS"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldTrace-apk
          path: android/app/build/outputs/apk/debug/FieldTrace.apk
          if-no-files-found: error
