<!doctype html>
<html lang="es" style="min-height:100%;background:#071126">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remix: Field Trace</title>
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FieldTrace" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/pwa-180x180.png" />
  </head>
  <body style="margin:0;min-height:100vh;background:linear-gradient(135deg,#071126 0%,#101d3a 55%,#172554 100%)">
    <div id="root" style="min-height:100vh">
      <main aria-label="Cargando Field Trace" style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#dbeafe;font:600 14px system-ui,sans-serif">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
          <div style="width:30px;height:30px;border:3px solid rgba(147,197,253,.25);border-top-color:#60a5fa;border-radius:50%;animation:fieldtrace-spin .8s linear infinite"></div>
          <span>Preparando Field Trace...</span>
        </div>
      </main>
      <style>@keyframes fieldtrace-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
